  <section class="fans-card">
    <p class="eyebrow">Euro-folk cabaret circus · Melbourne</p>

      <a class="btn btn-ghost" data-k="ott" href="../ott/">🎧 New album: Over The Top</a>

<script>
(function () {
  var y = document.getElementById('year'); if (y) y.textContent = new Date().getFullYear();
  // Pass the bio source (e.g. ?utm_source=instagram) through to every link so signups and sales can be traced.
  var q = new URLSearchParams(location.search), src = q.get('utm_source') || 'bio';
  document.querySelectorAll('#links a').forEach(function (a) {
    var u = new URL(a.getAttribute('href'), location.href);
    if (u.hostname.indexOf('spotify.com') > -1 || u.hostname.indexOf('youtube.com') > -1) return;
    u.searchParams.set('utm_source', src); u.searchParams.set('utm_medium', 'bio'); u.searchParams.set('utm_content', a.dataset.k);
    if (u.hostname.indexOf('bandcamp.com') > -1) u.searchParams.set('utm_campaign', 'links');
    a.href = u.toString();
  });
})();
</script>
